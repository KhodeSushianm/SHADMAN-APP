<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shima Academy — پنل مدیریت</title>
<style>
:root{--bg:#111315;--panel:#171a1d;--panel2:#1d2023;--text:#f2f0ec;--muted:#92979c;--line:rgba(255,255,255,.085);--accent:#9b9187;--accent2:#c0b7ae;--green:#88a994;--yellow:#b8a774;--red:#b88787;--blue:#8d9daf;--shadow:0 18px 50px rgba(0,0,0,.16);--sidebar:250px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 75% -20%,rgba(255,255,255,.045),transparent 30%),linear-gradient(180deg,#121416,#101214)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 0 0 auto;width:var(--sidebar);border-left:1px solid var(--line);background:rgba(19,21,23,.96);padding:18px 13px;display:flex;flex-direction:column;z-index:50}.brand{display:flex;gap:11px;align-items:center;padding:3px 7px 20px}.brandmark{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#777067,#4b4641);font-size:20px}.brand-name{font-weight:800;font-size:13px}.brand-sub{color:var(--muted);font-size:9px;margin-top:3px}.workspace{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:12px;padding:9px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.ws{display:flex;gap:8px;align-items:center;min-width:0}.ws-avatar{width:29px;height:29px;border-radius:8px;background:#2a2e31;display:grid;place-items:center;font-size:10px}.ws-name{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ws-sub{font-size:8px;color:var(--muted);margin-top:3px}.nav-title{font-size:8px;color:#686e73;padding:0 10px 7px;letter-spacing:.12em;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:2px}.nav-btn{width:100%;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;font-size:11px;text-align:right;transition 13px;border-radius:9px;font-size:9px}.ghost{border:0;background:transparent;color:var(--accent2);font-size:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat,.card{border:1px solid var(--line);background:rgba(255,255,255,.023);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:15px;min-height:112px}.stat-top{display:flex;justify-content:space-between;align-items:center}.stat-label{font-size:9px;color:var(--muted)}.stat-icon{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.055);color:var(--accent2)}.stat-num{font-size:25px;font-weight:900;margin-top:11px}.stat-foot{font-size:8px;color:var(--muted);margin-top:4px}.yellow{color:var(--yellow)}.blue{color:var(--blue)}.grid{display:grid;grid-template-columns:1.4fr .85fr;gap:12px;margin-top:12px}.card{overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.card-title{font-size:11px;font-weight:800}.card-sub{font-size:8px;color:var(--muted);margin-top:4px}.card-body{padding:15px}.chart{height:215px}.chart svg{width:100%;height:100%;overflow:visible}.chart-grid{stroke:rgba(255,255,255,.07);stroke-width:1}.chart-line{fill:none;stroke:var(--accent2);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.chart-dot{fill:var(--bg);stroke:var(--accent2);stroke-width:2}.chart-label{fill:var(--muted);font-size:10px}.empty{min-height:190px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:10px;padding:20px}.activity{padding:4px 16px 10px}.act{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055)}.act:last-child{border-bottom:0}.act-avatar{width:31px;height:31px;border-radius:9px;background:rgba(255,255,255,.055);display:grid;place-items:center;font-size:9px;color:var(--accent2)}.act-main{flex:1;min-width:0}.act-name{font-size:9px;font-weight:700}.act-text{font-size:8px;color:var(--muted);margin-top:3px}.act-time{font-size:7px;color:#666;white-space:nowrap}.table-card{margin-top:12px}.tools{padding:12px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{flex:1 1 300px;min-width:180px}.filter{flex:0 0 160px}.search,.filter,.field input,.field select,.field textarea{min-height:39px;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);border-radius:10px;padding:8px 10px;outline:none;font-size:9px}.search:focus,.filter:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(192,183,174,.48);box-shadow:0 0 0 3px rgba(192,183,174,.08)}::placeholder{color:#747a7f}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{font-size:8px;color:#72787d;font-weight:600;text-align:right;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}td{font-size:9px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}tbody tr:hover{background:rgba(255,255,255,.025)}.student{display:flex;align-items:center;gap:9px}.avatar{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#2d3134,#202326);font-size:9px;font-weight:800}.small{font-size:8px;color:var(--muted)}.status{display:inline-flex;padding:4px 7px;border-radius:6px;font-size:8px}.status.active{background:rgba(136,169,148,.12);color:#9fbaa8}.status.warning{background:rgba(184,167,116,.12);color:#c4b580}.status.inactive{background:rgba(184,135,135,.12);color:#c79a9a}.progress{height:5px;width:92px;border-radius:99px;background:#2a2e31;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#756c64,#b0a59a);border-radius:inherit}.row-actions{display:flex;gap:3px}.row-btn{width:28px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:7px;display:grid;place-items:center}.row-btn:hover{background:rgba(255,255,255,.055);color:var(--text)}.list{display:grid;gap:9px;padding:14px 16px}.plan-row{display:grid;grid-template-columns:42px 1fr auto auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px;background:rgba(255,255,255,.018)}.date-box{width:42px;height:42px;border-radius:9px;background:rgba(255,255,255,.05);display:grid;place-items:center;text-align:center}.date-box b{font-size:14px}.date-box span{font-size:7px;color:var(--muted)}.plan-title{font-size:10px;font-weight:800}.plan-meta{font-size:8px;color:var(--muted);margin-top:4px}.pill{font-size:8px;padding:5px 8px;border-radius:7px;background:rgba(255,255,255,.05);color:var(--muted)}.pill.done{color:#9fbaa8;background:rgba(136,169,148,.12)}.exam-card{padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}.exam-top{display:flex;justify-content:space-between}.score{font-size:24px;font-weight:900}.note-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:14px 16px}.note-card{border:1px solid var(--line);border-radius:12px;padding:13px;background:rgba(255,255,255,.02);min-height:145px;display:flex;flex-direction:column}.note-head{display:flex;justify-content:space-between;gap:8px}.note-student{font-size:10px;font-weight:800}.note-date{font-size:8px;color:var(--muted);margin-top:3px}.note-body{font-size:9px;line-height:1.9;color:#c7c8c8;margin-top:12px;white-space:pre-wrap;flex:1}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setting{padding:16px}.setting h3{font-size:11px;margin:0 0 7px}.setting p{font-size:9px;color:var(--muted);line-height:1.8;margin:0 0 13px}.path{direction:ltr;text-align:left;word-break:break-all;padding:10px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:8px;color:#b9b5b0}.setting-actions{display:flex;gap:7px;flex-wrap:wrap}.modal-back{position:fixed;inset:0;background:rgba(5,6,7,.68);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:100;padding:15px}.modal-back.show{display:flex}.modal{width:min(610px,100%);background:#191c1f;border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.35);padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-title{font-size:12px;font-weight:800}.close{width:31px;height:31px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-size:20px}.close:hover{background:rgba(255,255,255,.05)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:8px;color:var(--muted)}.field textarea{min-height:110px;resize:vertical}.modal-actions{display:flex;gap:7px;margin-top:16px}.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:90}.drawer-back.show{display:block}.drawer{position:fixed;top:0;right:0;width:min(460px,100%);height:100vh;background:#181b1e;border-left:1px solid var(--line);z-index:95;padding:19px;transform:translateX(100%);transition:.22s;overflow:auto}.drawer.show{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer-name{font-size:15px;font-weight:900}.detail{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:11px;padding:12px;margin-top:10px}.detail-label{font-size:8px;color:var(--muted)}.detail-value{font-size:10px;margin-top:5px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toast{position:fixed;bottom:20px;left:20px;background:#24282b;color:var(--text);border:1px solid var(--line);padding:10px 13px;border-radius:10px;font-size:9px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s;z-index:200}.toast.show{transform:translateY(0);opacity:1}.loading{min-height:360px;display:grid;place-items:center;color:var(--muted);font-size:10px}.mobile-menu{display:none}body.light{--bg:#e8e7e3;--panel:#f1f0ec;--panel2:#e8e7e3;--text:#252729;--muted:#6d7175;--line:rgba(38,40,42,.12);--accent:#6d655d;--accent2:#5e5750;background:linear-gradient(180deg,#ecebe8,#e5e4e0)}body.light .sidebar{background:rgba(239,238,235,.97)}body.light .topbar{background:rgba(236,235,232,.9)}body.light .card,body.light .stat{background:rgba(255,255,255,.36)}body.light .modal,body.light .drawer{background:#f2f1ee}body.light .note-body{color:#4e5154}body.light .avatar{background:linear-gradient(145deg,#d2cfc9,#bbb7b0);color:#34312d}@media(max-width:1050px){:root{--sidebar:220px}.main{padding-inline:20px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.settings-grid{grid-template-columns:1fr}.note-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){:root{--sidebar:0px}.sidebar{transform:translateX(100%);width:250px;transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-right:0;padding-inline:14px}.mobile-menu{display:grid;place-items:center;width:37px;height:37px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:9px}.topbar{gap:8px}.page-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.note-grid,.exam-grid{grid-template-columns:1fr}.plan-row{grid-template-columns:42px 1fr}.plan-row .pill,.plan-row .row-actions{grid-column:2}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">⌂</div><div><div class="brand-name">Shima Academy</div><div class="brand-sub">پنل مدیریت مشاوره</div></div></div><div class="workspace"><div class="ws"><div class="ws-avatar">SA</div><div><div class="ws-name">آکادمی شیما شادمان</div><div class="ws-sub" id="storageLabel">در حال آماده‌سازی…</div></div></div><button class="icon-btn" data-action="choose-folder" title="تغییر محل ذخیره">⚙</button></div><div class="nav-title">Workspace</div><nav class="nav"><button class="nav-btn active" data-page="dashboard"><span class="ico">▦</span>داشبورد</button><button class="nav-btn" data-page="students"><span class="ico">♙</span>دانش‌آموزان <span class="nav-count" id="studentCount">0</span></button><button class="nav-btn" data-page="plans"><span class="ico">☷</span>برنامه‌ها</button><button class="nav-btn" data-page="exams"><span class="ico">◈</span>آزمون‌ها</button><button class="nav-btn" data-page="notes"><span class="ico">▤</span>یادداشت‌ها</button></nav><div class="nav-title">System</div><nav class="nav"><button class="nav-btn" data-page="settings"><span class="ico">⚙</span>تنظیمات</button></nav><div class="sidebar-bottom"><div class="user"><div class="user-avatar">ش</div><div><div class="user-name">مشاور</div><div class="user-sub">Shima Academy</div></div></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:8px"><button class="mobile-menu" id="mobileMenu">☰</button><div class="crumb" id="crumb">داشبورد</div></div><div class="top-actions"><button class="icon-btn" data-action="toggle-theme" title="تغییر تم">◐</button></div></header><section class="content" id="content"><div class="loading">در حال آماده‌سازی پنل…</div></section></main></div><div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div><div class="drawer-back" id="drawerBack"></div><aside class="drawer" id="drawer"></aside><div class="toast" id="toast"></div>
<script>
const api=window.electronAPI;const state={page:'dashboard',students:[],plans:[],exams:[],notes:[],theme:localStorage.getItem('shima-theme')||'dark',storage:null,search:''};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmtDate=v=>{if(!v)return'—';try{return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'short',day:'numeric'}).format(new Date(v+'T00:00:00'))}catch{return v}};const initials=(a,b)=>((a||'')[0]||'')+((b||'')[0]||'');const today=()=>new Date().toISOString().slice(0,10);const toast=msg=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2300)};function setTheme(){document.body.classList.toggle('light',state.theme==='light');localStorage.setItem('shima-theme',state.theme)}async function q(sql,p=[]){return api.query(sql,p)}async function run(sql,p=[]){return api.run(sql,p)}async function nextId(table){const r=await q(`SELECT COALESCE(MAX(id),0)+1 AS id FROM ${table}`);return Number(r[0].id)}async function loadAll(){state.students=await q('SELECT * FROM students ORDER BY id DESC');state.plans=await q('SELECT p.*,s.first_name,s.last_name FROM plans p LEFT JOIN students s ON s.id=p.student_id ORDER BY date DESC,id DESC');state.exams=await q('SELECT e.*,s.first_name,s.last_name FROM exams e LEFT JOIN students s ON s.id=e.student_id ORDER BY date DESC,id DESC');state.notes=await q('SELECT n.*,s.first_name,s.last_name FROM notes n LEFT JOIN students s ON s.id=n.student_id ORDER BY date DESC,id DESC');$('#studentCount').textContent=state.students.length}function studentsOptions(selected=''){return state.students.length?state.students.map(s=>`<option value="${s.id}" ${String(s.id)===String(selected)?'selected':''}>${esc((s.first_name+' '+s.last_name).trim())}</option>`).join(''):'<option value="">ابتدا دانش‌آموز اضافه کنید</option>'}function statusText(s){return s==='active'?'فعال':s==='warning'?'نیازمند پیگیری':'غیرفعال'}function studentRow(s){return`<tr><td><div class="student"><div class="avatar">${esc(initials(s.first_name,s.last_name))}</div><div><b>${esc((s.first_name+' '+s.last_name).trim()||'بدون نام')}</b><div class="small">${esc(s.phone||'بدون شماره')}</div></div></div></td><td>${esc(s.grade||'—')}</td><td>${esc(s.field||'—')}</td><td><span class="status ${esc(s.status)}">${statusText(s.status)}</span></td><td><div class="progress"><i style="width:${Math.max(0,Math.min(100,Number(s.progress)||0))}%"></i></div></td><td>${Number(s.score)||0}</td><td><div class="row-actions"><button class="row-btn" data-action="student-view" data-id="${s.id}">◉</button><button class="row-btn" data-action="student-edit" data-id="${s.id}">✎</button><button class="row-btn" data-action="student-delete" data-id="${s.id}">×</button></div></td></tr>`}
function scoreChart(){const groups={};state.exams.forEach(e=>{const k=e.date||e.title||String(e.id);(groups[k]??=[]).push(Number(e.score)||0)});const arr=Object.keys(groups).sort().slice(-7).map(k=>({label:k,score:Math.round(groups[k].reduce((a,b)=>a+b,0)/groups[k].length)}));if(!arr.length)return'<div class="empty">هنوز داده‌ای برای نمایش وجود ندارد<br><span class="small">با ثبت آزمون، نمودار به‌صورت خودکار ساخته می‌شود.</span></div>';const W=760,H=215,pad=28,min=Math.min(...arr.map(x=>x.score)),max=Math.max(...arr.map(x=>x.score)),range=Math.max(100,max-min),lo=min-range*.25,hi=max+range*.25,pts=arr.map((x,i)=>{const X=pad+i*((W-pad*2)/Math.max(1,arr.length-1));const Y=H-pad-((x.score-lo)/(hi-lo))*(H-pad*2);return{...x,X,Y}}),path=pts.map((p,i)=>(i?'L':'M')+p.X.toFixed(1)+' '+p.Y.toFixed(1)).join('');return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${pad}" y1="45" x2="${W-pad}" y2="45" class="chart-grid"/><line x1="${pad}" y1="105" x2="${W-pad}" y2="105" class="chart-grid"/><line x1="${pad}" y1="165" x2="${W-pad}" y2="165" class="chart-grid"/><path d="${path}" class="chart-line"/>${pts.map(p=>`<circle cx="${p.X}" cy="${p.Y}" r="4" class="chart-dot"/><text x="${p.X}" y="${Math.max(17,p.Y-10)}" text-anchor="middle" class="chart-label">${p.score}</text><text x="${p.X}" y="202" text-anchor="middle" class="chart-label">${esc(fmtDate(p.label))}</text>`).join('')}</svg></div>`}
function dashboard(){const active=state.students.filter(s=>s.status==='active').length,pending=state.plans.filter(p=>p.status!=='done').length,avg=state.exams.length?Math.round(state.exams.reduce((a,b)=>a+Number(b.score||0),0)/state.exams.length):0,upcoming=state.plans.filter(p=>p.status!=='done').slice(0,5);return`<div class="page-head"><div><div class="eyebrow">OVERVIEW</div><h1 class="title">داشبورد</h1><div class="desc">نمای کلی وضعیت دانش‌آموزان، برنامه‌ها و آزمون‌ها</div></div><button class="primary" data-action="student-new">＋ دانش‌آموز جدید</button></div><div class="stats"><div class="stat"><div class="stat-top"><span class="stat-label">کل دانش‌آموزان</span><span class="stat-icon">♙</span></div><div class="stat-num">${state.students.length}</div><div class="stat-foot">${active} نفر فعال</div></div><div class="stat"><div class="stat-top"><span class="stat-label">برنامه‌های باز</span><span class="stat-icon">☷</span></div><div class="stat-num yellow">${pending}</div><div class="stat-foot">نیازمند انجام یا پیگیری</div></div><div class="stat"><div class="stat-top"><span class="stat-label">آزمون ثبت‌شده</span><span class="stat-icon">◈</span></div><div class="stat-num blue">${state.exams.length}</div><div class="stat-foot">داده واقعی از دیتابیس</div></div><div class="stat"><div class="stat-top"><span class="stat-label">میانگین تراز</span><span class="stat-icon">↗</span></div><div class="stat-num">${avg||'—'}</div><div class="stat-foot">بر اساس آزمون‌های ثبت‌شده</div></div></div><div class="grid"><div class="card"><div class="card-head"><div><div class="card-title">روند میانگین تراز</div><div class="card-sub">آخرین آزمون‌های ثبت‌شده</div></div><button class="ghost" data-page="exams">مشاهده آزمون‌ها ←</button></div><div class="card-body">${scoreChart()}</div></div><div class="card"><div class="card-head"><div><div class="card-title">برنامه‌های پیش‌رو</div><div class="card-sub">مواردی که هنوز انجام نشده‌اند</div></div><button class="ghost" data-page="plans">همه ←</button></div><div class="activity">${upcoming.length?upcoming.map(p=>`<div class="act"><div class="act-avatar">${esc((p.subject||'؟')[0])}</div><div class="act-main"><div class="act-name">${esc(p.title||p.subject||'برنامه')}</div><div class="act-text">${esc((p.first_name+' '+p.last_name).trim()||'دانش‌آموز')} · ${fmtDate(p.date)}</div></div><div class="act-time">${Number(p.minutes)||0}د</div></div>`).join(''):'<div class="empty">هنوز برنامه‌ای ثبت نشده است</div>'}</div></div></div><div class="card table-card"><div class="card-head"><div><div class="card-title">دانش‌آموزان اخیر</div><div class="card-sub">آخرین رکوردهای ثبت‌شده</div></div><button class="ghost" data-page="students">همه دانش‌آموزان ←</button></div><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>پایه</th><th>رشته</th><th>وضعیت</th><th>پیشرفت</th><th>تراز</th><th></th></tr></thead><tbody>${state.students.slice(0,6).map(studentRow).join('')||'<tr><td colspan="7"><div class="empty">هنوز دانش‌آموزی ثبت نشده است</div></td></tr>'}</tbody></table></div></div>`}
function studentsPage(){const term=state.search.trim().toLowerCase(),list=state.students.filter(s=>(s.first_name+' '+s.last_name+' '+s.phone+' '+s.field).toLowerCase().includes(term));return`<div class="page-head"><div><div class="eyebrow">STUDENTS</div><h1 class="title">دانش‌آموزان</h1><div class="desc">مدیریت اطلاعات، وضعیت و پیشرفت دانش‌آموزان</div></div><button class="primary" data-action="student-new">＋ دانش‌آموز جدید</button></div><div class="card table-card"><div class="tools"><input class="search" id="studentSearch" value="${esc(state.search)}" placeholder="جستجو بر اساس نام، شماره یا رشته…"><select class="filter" id="studentFilter"><option value="all">همه وضعیت‌ها</option><option value="active">فعال</option><option value="warning">نیازمند پیگیری</option><option value="inactive">غیرفعال</option></select></div><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>پایه</th><th>رشته</th><th>وضعیت</th><th>پیشرفت</th><th>تراز</th><th></th></tr></thead><tbody>${list.length?list.map(studentRow).join(''):`<tr><td colspan="7"><div class="empty">${state.students.length?'نتیجه‌ای پیدا نشد':'هنوز دانش‌آموزی ثبت نشده است'}</div></td></tr>`}</tbody></table></div></div>`}
function plansPage(){return`<div class="page-head"><div><div class="eyebrow">PLANS</div><h1 class="title">برنامه‌ها</h1><div class="desc">برنامه مطالعه و پیگیری روزانه دانش‌آموزان</div></div><button class="primary" data-action="plan-new">＋ برنامه جدید</button></div><div class="card"><div class="list">${state.plans.length?state.plans.map(p=>`<div class="plan-row"><div class="date-box"><b>${esc((p.date||'--').slice(8,10)||'--')}</b><span>${esc((p.date||'').slice(5,7)||'ماه')}</span></div><div><div class="plan-title">${esc(p.title||p.subject||'برنامه بدون عنوان')}</div><div class="plan-meta">${esc((p.first_name+' '+p.last_name).trim()||'دانش‌آموز')} · ${esc(p.subject||'بدون درس')} · ${Number(p.minutes)||0} دقیقه</div></div><span class="pill ${p.status==='done'?'done':''}">${p.status==='done'?'انجام شد':'در انتظار'}</span><div class="row-actions"><button class="row-btn" data-action="plan-toggle" data-id="${p.id}">✓</button><button class="row-btn" data-action="plan-edit" data-id="${p.id}">✎</button><button class="row-btn" data-action="plan-delete" data-id="${p.id}">×</button></div></div>`).join(''):'<div class="empty">هنوز برنامه‌ای ثبت نشده است.</div>'}</div></div>`}
function examsPage(){return`<div class="page-head"><div><div class="eyebrow">EXAMS</div><h1 class="title">آزمون‌ها</h1><div class="desc">ثبت و بررسی نتایج آزمون‌های آزمایشی</div></div><button class="primary" data-action="exam-new">＋ ثبت آزمون</button></div><div class="grid"><div class="card"><div class="card-head"><div><div class="card-title">روند تراز</div><div class="card-sub">میانگین آزمون‌ها</div></div></div><div class="card-body">${scoreChart()}</div></div><div class="card"><div class="card-head"><div><div class="card-title">آخرین نتایج</div><div class="card-sub">${state.exams.length} رکورد</div></div></div><div class="list">${state.exams.slice(0,6).map(e=>`<div class="exam-card"><div class="exam-top"><div><b>${esc(e.title||'آزمون')}</b><div class="small">${esc((e.first_name+' '+e.last_name).trim()||'دانش‌آموز')} · ${fmtDate(e.date)}</div></div><div class="score">${Number(e.score)||0}</div></div></div>`).join('')||'<div class="empty">هنوز آزمونی ثبت نشده است.</div>'}</div></div></div><div class="card table-card"><div class="card-head"><div class="card-title">همه آزمون‌ها</div></div><div class="table-wrap"><table><thead><tr><th>آزمون</th><th>دانش‌آموز</th><th>تاریخ</th><th>تراز</th><th></th></tr></thead><tbody>${state.exams.map(e=>`<tr><td>${esc(e.title||'آزمون')}</td><td>${esc((e.first_name+' '+e.last_name).trim()||'—')}</td><td>${fmtDate(e.date)}</td><td><b>${Number(e.score)||0}</b></td><td><div class="row-actions"><button class="row-btn" data-action="exam-edit" data-id="${e.id}">✎</button><button class="row-btn" data-action="exam-delete" data-id="${e.id}">×</button></div></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">هنوز آزمونی ثبت نشده است.</div></td></tr>'}</tbody></table></div></div>`}
function notesPage(){return`<div class="page-head"><div><div class="eyebrow">NOTES</div><h1 class="title">یادداشت‌ها</h1><div class="desc">یادداشت‌های مشاوره و پیگیری هر دانش‌آموز</div></div><button class="primary" data-action="note-new">＋ یادداشت جدید</button></div><div class="card"><div class="tools"><input class="search" id="noteSearch" value="${esc(state.search)}" placeholder="جستجو در یادداشت‌ها و نام دانش‌آموز…"></div><div class="note-grid">${state.notes.filter(n=>(n.body+' '+n.first_name+' '+n.last_name).toLowerCase().includes(state.search.toLowerCase())).map(n=>`<article class="note-card"><div class="note-head"><div><div class="note-student">${esc((n.first_name+' '+n.last_name).trim()||'دانش‌آموز')}</div><div class="note-date">${fmtDate(n.date)}</div></div><div class="row-actions"><button class="row-btn" data-action="note-edit" data-id="${n.id}">✎</button><button class="row-btn" data-action="note-delete" data-id="${n.id}">×</button></div></div><div class="note-body">${esc(n.body||'')}</div></article>`).join('')||'<div class="empty" style="grid-column:1/-1">هنوز یادداشتی ثبت نشده است.</div>'}</div></div>`}
function settingsPage(){return`<div class="page-head"><div><div class="eyebrow">SYSTEM</div><h1 class="title">تنظیمات</h1><div class="desc">مدیریت محل ذخیره‌سازی، پشتیبان و ظاهر برنامه</div></div></div><div class="settings-grid"><div class="card setting"><h3>ذخیره‌سازی SQLite</h3><p>تمام اطلاعات برنامه در یک فایل SQLite محلی ذخیره می‌شود. می‌توانید پوشه آن را تغییر دهید.</p><div class="path">${esc(state.storage?.file||'در حال دریافت…')}</div><div class="setting-actions" style="margin-top:11px"><button class="primary" data-action="choose-folder">تغییر پوشه</button><button class="secondary" data-action="open-folder">باز کردن پوشه</button></div></div><div class="card setting"><h3>پشتیبان‌گیری</h3><p>از دیتابیس فعلی یک نسخه مستقل بسازید یا یک فایل SQLite قبلی را بازیابی کنید.</p><div class="setting-actions"><button class="primary" data-action="export-db">خروجی / Backup</button><button class="secondary" data-action="import-db">بازیابی Backup</button></div></div><div class="card setting"><h3>ظاهر برنامه</h3><p>تم مات و خنثی برای کار طولانی‌مدت طراحی شده است.</p><div class="setting-actions"><button class="secondary" data-action="toggle-theme">تغییر به ${state.theme==='dark'?'تم روشن':'تم تیره'}</button></div></div><div class="card setting"><h3>اطلاعات نسخه</h3><p>نسخه دسکتاپ با Electron و SQLite. رابط کاربری و منطق اجرا به اینترنت وابسته نیست.</p><div class="path" style="direction:rtl;text-align:right">Shima Academy · Desktop 2.0.0</div></div></div>`}
function render(){const pages={dashboard:['داشبورد',dashboard],students:['دانش‌آموزان',studentsPage],plans:['برنامه‌ها',plansPage],exams:['آزمون‌ها',examsPage],notes:['یادداشت‌ها',notesPage],settings:['تنظیمات',settingsPage]};const p=pages[state.page]||pages.dashboard;$('#crumb').textContent=p[0];$('#content').innerHTML=p[1]();document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));setTheme();if($('#storageLabel')&&state.storage)$('#storageLabel').textContent=state.storage.folder.split(/[\\/]/).pop()||'SQLite'}function go(page){state.page=page;state.search='';render();$('#sidebar').classList.remove('open');window.scrollTo(0,0)}function openModal(html){$('#modal').innerHTML=html;$('#modalBack').classList.add('show')}function closeModal(){$('#modalBack').classList.remove('show');$('#modal').innerHTML=''}function closeDrawer(){$('#drawer').classList.remove('show');$('#drawerBack').classList.remove('show')}
function studentForm(s={}){openModal(`<div class="modal-head"><div class="modal-title">${s.id?'ویرایش دانش‌آموز':'دانش‌آموز جدید'}</div><button class="close" data-action="modal-close">×</button></div><div class="form-grid"><div class="field"><label>نام</label><input id="f_first" value="${esc(s.first_name)}"></div><div class="field"><label>نام خانوادگی</label><input id="f_last" value="${esc(s.last_name)}"></div><div class="field"><label>شماره تماس</label><input id="f_phone" value="${esc(s.phone)}"></div><div class="field"><label>پایه</label><input id="f_grade" value="${esc(s.grade)}" placeholder="مثلاً دوازدهم"></div><div class="field"><label>رشته</label><input id="f_field" value="${esc(s.field)}"></div><div class="field"><label>مشاور</label><input id="f_advisor" value="${esc(s.advisor||'مشاور')}"></div><div class="field"><label>وضعیت</label><select id="f_status"><option value="active" ${s.status==='active'||!s.status?'selected':''}>فعال</option><option value="warning" ${s.status==='warning'?'selected':''}>نیازمند پیگیری</option><option value="inactive" ${s.status==='inactive'?'selected':''}>غیرفعال</option></select></div><div class="field"><label>تراز فعلی</label><input id="f_score" type="number" value="${Number(s.score)||0}"></div><div class="field full"><label>درصد پیشرفت</label><input id="f_progress" type="number" min="0" max="100" value="${Number(s.progress)||0}"></div></div><div class="modal-actions"><button class="primary" data-action="student-save" data-id="${s.id||''}">ذخیره</button><button class="secondary" data-action="modal-close">انصراف</button></div>`)}async function saveStudent(id){const v=[$('#f_first').value.trim(),$('#f_last').value.trim(),$('#f_phone').value.trim(),$('#f_grade').value.trim(),$('#f_field').value.trim(),$('#f_advisor').value.trim(),$('#f_status').value,Number($('#f_score').value)||0,Math.max(0,Math.min(100,Number($('#f_progress').value)||0))];if(!v[0]&&!v[1])return toast('نام دانش‌آموز را وارد کنید');if(id)await run('UPDATE students SET first_name=?,last_name=?,phone=?,grade=?,field=?,advisor=?,status=?,score=?,progress=? WHERE id=?',[...v,Number(id)]);else await run('INSERT INTO students (id,first_name,last_name,phone,grade,field,advisor,status,score,progress,created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?)',[await nextId('students'),...v,today()]);closeModal();await loadAll();render();toast('اطلاعات دانش‌آموز ذخیره شد')}
function planForm(p={}){openModal(`<div class="modal-head"><div class="modal-title">${p.id?'ویرایش برنامه':'برنامه جدید'}</div><button class="close" data-action="modal-close">×</button></div><div class="form-grid"><div class="field full"><label>دانش‌آموز</label><select id="p_student">${studentsOptions(p.student_id)}</select></div><div class="field"><label>تاریخ</label><input id="p_date" type="date" value="${esc(p.date||today())}"></div><div class="field"><label>درس</label><input id="p_subject" value="${esc(p.subject)}"></div><div class="field full"><label>عنوان برنامه</label><input id="p_title" value="${esc(p.title)}"></div><div class="field"><label>مدت (دقیقه)</label><input id="p_minutes" type="number" value="${Number(p.minutes)||60}"></div><div class="field"><label>وضعیت</label><select id="p_status"><option value="pending" ${p.status!=='done'?'selected':''}>در انتظار</option><option value="done" ${p.status==='done'?'selected':''}>انجام شد</option></select></div></div><div class="modal-actions"><button class="primary" data-action="plan-save" data-id="${p.id||''}">ذخیره</button><button class="secondary" data-action="modal-close">انصراف</button></div>`)}async function savePlan(id){const sid=Number($('#p_student').value);if(!sid)return toast('ابتدا یک دانش‌آموز انتخاب کنید');const v=[sid,$('#p_date').value,$('#p_subject').value.trim(),$('#p_title').value.trim(),Number($('#p_minutes').value)||0,$('#p_status').value];if(id)await run('UPDATE plans SET student_id=?,date=?,subject=?,title=?,minutes=?,status=? WHERE id=?',[...v,Number(id)]);else await run('INSERT INTO plans (id,student_id,date,subject,title,minutes,status) VALUES (?,?,?,?,?,?,?)',[await nextId('plans'),...v]);closeModal();await loadAll();render();toast('برنامه ذخیره شد')}
function examForm(e={}){openModal(`<div class="modal-head"><div class="modal-title">${e.id?'ویرایش آزمون':'ثبت آزمون'}</div><button class="close" data-action="modal-close">×</button></div><div class="form-grid"><div class="field full"><label>دانش‌آموز</label><select id="e_student">${studentsOptions(e.student_id)}</select></div><div class="field"><label>عنوان آزمون</label><input id="e_title" value="${esc(e.title)}"></div><div class="field"><label>تاریخ</label><input id="e_date" type="date" value="${esc(e.date||today())}"></div><div class="field full"><label>تراز</label><input id="e_score" type="number" value="${Number(e.score)||0}"></div></div><div class="modal-actions"><button class="primary" data-action="exam-save" data-id="${e.id||''}">ذخیره</button><button class="secondary" data-action="modal-close">انصراف</button></div>`)}async function saveExam(id){const sid=Number($('#e_student').value);if(!sid)return toast('ابتدا یک دانش‌آموز انتخاب کنید');const v=[sid,$('#e_title').value.trim(),$('#e_date').value,Number($('#e_score').value)||0];if(id)await run('UPDATE exams SET student_id=?,title=?,date=?,score=? WHERE id=?',[...v,Number(id)]);else await run('INSERT INTO exams (id,student_id,title,date,score) VALUES (?,?,?,?,?)',[await nextId('exams'),...v]);closeModal();await loadAll();render();toast('نتیجه آزمون ذخیره شد')}
function noteForm(n={}){openModal(`<div class="modal-head"><div class="modal-title">${n.id?'ویرایش یادداشت':'یادداشت جدید'}</div><button class="close" data-action="modal-close">×</button></div><div class="form-grid"><div class="field full"><label>دانش‌آموز</label><select id="n_student">${studentsOptions(n.student_id)}</select></div><div class="field full"><label>تاریخ</label><input id="n_date" type="date" value="${esc(n.date||today())}"></div><div class="field full"><label>متن یادداشت</label><textarea id="n_body" placeholder="نکات جلسه، پیگیری‌ها و تصمیم‌های بعدی…">${esc(n.body)}</textarea></div></div><div class="modal-actions"><button class="primary" data-action="note-save" data-id="${n.id||''}">ذخیره</button><button class="secondary" data-action="modal-close">انصراف</button></div>`)}async function saveNote(id){const sid=Number($('#n_student').value);if(!sid)return toast('ابتدا یک دانش‌آموز انتخاب کنید');const body=$('#n_body').value.trim();if(!body)return toast('متن یادداشت را وارد کنید');const v=[sid,body,$('#n_date').value];if(id)await run('UPDATE notes SET student_id=?,body=?,date=? WHERE id=?',[...v,Number(id)]);else await run('INSERT INTO notes (id,student_id,body,date) VALUES (?,?,?,?)',[await nextId('notes'),...v]);closeModal();await loadAll();render();toast('یادداشت ذخیره شد')}
function studentDrawer(id){const s=state.students.find(x=>x.id===Number(id));if(!s)return;const plans=state.plans.filter(x=>x.student_id===s.id).slice(0,5),exams=state.exams.filter(x=>x.student_id===s.id).slice(0,5),notes=state.notes.filter(x=>x.student_id===s.id).slice(0,3);$('#drawer').innerHTML=`<div class="drawer-head"><div><div class="drawer-name">${esc((s.first_name+' '+s.last_name).trim()||'دانش‌آموز')}</div><div class="small">${esc(s.phone||'بدون شماره')}</div></div><button class="close" data-action="drawer-close">×</button></div><div class="detail-grid"><div class="detail"><div class="detail-label">پایه</div><div class="detail-value">${esc(s.grade||'—')}</div></div><div class="detail"><div class="detail-label">رشته</div><div class="detail-value">${esc(s.field||'—')}</div></div><div class="detail"><div class="detail-label">وضعیت</div><div class="detail-value">${statusText(s.status)}</div></div><div class="detail"><div class="detail-label">تراز</div><div class="detail-value">${Number(s.score)||0}</div></div></div><div class="detail"><div class="detail-label">پیشرفت</div><div class="progress" style="width:100%;margin-top:9px"><i style="width:${Number(s.progress)||0}%"></i></div><div class="small" style="margin-top:6px">${Number(s.progress)||0}%</div></div><div class="detail"><div class="detail-label">آخرین آزمون‌ها</div>${exams.length?exams.map(e=>`<div class="act"><div class="act-main"><div class="act-name">${esc(e.title||'آزمون')}</div><div class="act-text">${fmtDate(e.date)}</div></div><div class="act-time">${Number(e.score)||0}</div></div>`).join(''):'<div class="small" style="margin-top:8px">آزمونی ثبت نشده.</div>'}</div><div class="detail"><div class="detail-label">برنامه‌ها</div>${plans.length?plans.map(p=>`<div class="act"><div class="act-main"><div class="act-name">${esc(p.title||p.subject||'برنامه')}</div><div class="act-text">${fmtDate(p.date)}</div></div><div class="pill ${p.status==='done'?'done':''}">${p.status==='done'?'انجام':'باز'}</div></div>`).join(''):'<div class="small" style="margin-top:8px">برنامه‌ای ثبت نشده.</div>'}</div><div class="detail"><div class="detail-label">یادداشت‌های اخیر</div>${notes.length?notes.map(n=>`<div class="note-body" style="margin-top:8px">${esc(n.body)}</div>`).join(''):'<div class="small" style="margin-top:8px">یادداشتی ثبت نشده.</div>'}</div>`;$('#drawerBack').classList.add('show');$('#drawer').classList.add('show')}
async function confirmDelete(kind,id){const names={student:'دانش‌آموز',plan:'برنامه',exam:'آزمون',note:'یادداشت'};if(!confirm(`آیا ${names[kind]} حذف شود؟`))return;const table={student:'students',plan:'plans',exam:'exams',note:'notes'}[kind];await run(`DELETE FROM ${table} WHERE id=?`,[Number(id)]);await loadAll();closeDrawer();render();toast(`${names[kind]} حذف شد`)}async function chooseFolder(){const r=await api.chooseFolder();if(!r.cancelled){state.storage={folder:r.folder,file:r.file};await loadAll();render();toast('محل ذخیره‌سازی تغییر کرد')}}async function boot(){try{setTheme();await api.ready();state.storage=await api.getStorageInfo();await loadAll();render()}catch(e){console.error(e);$('#content').innerHTML='<div class="card" style="margin-top:35px;padding:30px"><b>خطا در راه‌اندازی برنامه</b><p class="small" style="margin-top:8px">دیتابیس محلی نتوانست راه‌اندازی شود. برنامه را ببندید و دوباره اجرا کنید.</p></div>'}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action],[data-page]');if(!el)return;if(el.dataset.page){go(el.dataset.page);return}const a=el.dataset.action,id=el.dataset.id;try{if(a==='modal-close')closeModal();else if(a==='drawer-close')closeDrawer();else if(a==='toggle-theme'){state.theme=state.theme==='dark'?'light':'dark';setTheme();if(state.page==='settings')render()}else if(a==='choose-folder')await chooseFolder();else if(a==='open-folder')await api.openFolder();else if(a==='export-db'){const r=await api.exportDatabase();if(!r.cancelled)toast('نسخه پشتیبان ذخیره شد')}else if(a==='import-db'){if(!confirm('با بازیابی Backup، دیتابیس فعلی با فایل انتخابی جایگزین می‌شود. ادامه؟'))return;const r=await api.importDatabase();if(!r.cancelled){await loadAll();render();toast('Backup بازیابی شد')}}else if(a==='student-new')studentForm();else if(a==='student-edit')studentForm(state.students.find(s=>s.id===Number(id)));else if(a==='student-view')studentDrawer(id);else if(a==='student-delete')await confirmDelete('student',id);else if(a==='student-save')await saveStudent(id);else if(a==='plan-new'){if(!state.students.length)return toast('ابتدا یک دانش‌آموز اضافه کنید');planForm()}else if(a==='plan-edit')planForm(state.plans.find(p=>p.id===Number(id)));else if(a==='plan-delete')await confirmDelete('plan',id);else if(a==='plan-toggle'){await run("UPDATE plans SET status=CASE WHEN status='done' THEN 'pending' ELSE 'done' END WHERE id=?",[Number(id)]);await loadAll();render()}else if(a==='plan-save')await savePlan(id);else if(a==='exam-new'){if(!state.students.length)return toast('ابتدا یک دانش‌آموز اضافه کنید');examForm()}else if(a==='exam-edit')examForm(state.exams.find(x=>x.id===Number(id)));else if(a==='exam-delete')await confirmDelete('exam',id);else if(a==='exam-save')await saveExam(id);else if(a==='note-new'){if(!state.students.length)return toast('ابتدا یک دانش‌آموز اضافه کنید');noteForm()}else if(a==='note-edit')noteForm(state.notes.find(x=>x.id===Number(id)));else if(a==='note-delete')await confirmDelete('note',id);else if(a==='note-save')await saveNote(id)}catch(err){console.error(err);toast('عملیات انجام نشد؛ جزئیات در کنسول ثبت شد')}});
document.addEventListener('input',e=>{if(e.target.id==='studentSearch'||e.target.id==='noteSearch'){state.search=e.target.value;render();const x=$(e.target.id==='studentSearch'?'#studentSearch':'#noteSearch');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}}});document.addEventListener('change',e=>{if(e.target.id==='studentFilter'){const f=e.target.value;document.querySelectorAll('#content tbody tr').forEach(r=>{const btn=r.querySelector('[data-action="student-view"]');const s=btn&&state.students.find(x=>String(x.id)===btn.dataset.id);if(s)r.style.display=f==='all'||s.status===f?'':'none'})}});$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});$('#drawerBack').addEventListener('click',closeDrawer);$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));boot();
</script></body></html>
