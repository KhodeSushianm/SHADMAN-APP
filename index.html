<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Vazirmatn,sans-serif;background:#111315;color:#f2f1ee}:root{--bg:#111315;--surface:#17191c;--surface2:#1d2023;--surface3:#25282b;--border:rgba(255,255,255,.09);--muted:#8b9095;--text:#f2f1ee;--primary:#857a70;--primary-strong:#aaa095;--green:#7fa48d;--yellow:#b4a16f;--red:#b98787;--blue:#879aaa;--focus:rgba(176,166,154,.22);--sidebar:245px}body{background:radial-gradient(circle at 70% -15%,rgba(255,255,255,.035),transparent 34%),linear-gradient(180deg,#111315 0%,#101214 100%)}body.light{--bg:#e9e8e5;--surface:#f1f0ed;--surface2:#e7e6e2;--surface3:#dddbd6;--border:rgba(38,40,42,.12);--muted:#6f7377;--text:#252729;--primary:#6f675e;--primary-strong:#5f5851;--focus:rgba(95,88,81,.16);background:linear-gradient(180deg,#ecebe8 0%,#e7e6e2 100%)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{display:flex;min-height:100vh}.sidebar{position:fixed;right:0;top:0;width:var(--sidebar);height:100vh;padding:17px 13px;background:rgba(20,22,24,.86);backdrop-filter:blur(22px);border-left:1px solid var(--border);z-index:50;display:flex;flex-direction:column;box-shadow:8px 0 28px rgba(0,0,0,.08)}.light .sidebar{background:rgba(239,238,235,.88)}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 20px}.brand-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#777067,#514b45);box-shadow:0 8px 24px rgba(0,0,0,.18)}.brand-icon svg{width:18px}.brand-name{font-size:13px;font-weight:700}.brand-sub{font-size:9px;color:var(--muted);margin-top:2px}.workspace{display:flex;align-items:center;justify-content:space-between;padding:9px;margin-bottom:18px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.025)}.ws-left{display:flex;gap:8px;align-items:center}.ws-avatar{width:27px;height:27px;border-radius:8px;background:#2a2d30;display:grid;place-items:center;font-size:10px}.ws-name{font-size:10px;font-weight:600}.ws-sub{font-size:8px;color:var(--muted)}.nav-title{font-size:8px;color:#666b70;padding:0 10px 7px;text-transform:uppercase;letter-spacing:.1em}.nav{margin-bottom:20px}.nav-btn{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:9px;font-size:11px;text-align:right;margin:2px 0;transition:.2s}.nav-btn:hover{background:rgba(255,255,255,.055);color:var(--text)}.nav-btn.active{color:var(--text);background:rgba(255,255,255,.055);box-shadow:inset -2px 0 var(--primary)}.nav-btn svg{width:15px}.nav-count{margin-right:auto;font-size:8px;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.055);color:var(--primary-strong)}.sidebar-bottom{margin-top:auto}.user{display:flex;align-items:center;gap:8px;padding:9px;border-radius:10px}.user-avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#777067,#4e4842);font-size:10px;font-weight:700}.user-name{font-size:10px;font-weight:600}.user-sub{font-size:8px;color:var(--muted)}
.main{width:calc(100% - var(--sidebar));margin-right:var(--sidebar);padding:0 35px 50px}.topbar{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(17,19,21,.84);backdrop-filter:blur(18px);z-index:30}.light .topbar{background:rgba(236,235,232,.84)}.crumb{font-size:10px;color:var(--muted)}.top-actions{display:flex;gap:7px}.icon-btn{width:34px;height:34px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:9px;display:grid;place-items:center}.icon-btn:hover{background:rgba(255,255,255,.055);border-color:var(--border);color:var(--text)}.icon-btn svg{width:15px}.content{max-width:1450px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:end;padding:32px 0 23px}.eyebrow{font-size:9px;color:var(--primary-strong);font-weight:700;letter-spacing:.08em}.title{font-size:25px;margin:6px 0 0;letter-spacing:-.7px}.desc{font-size:10px;color:var(--muted);margin-top:6px}.primary{display:inline-flex;align-items:center;gap:7px;border:0;color:#f4f2ee;background:linear-gradient(135deg,#857a70,#635b53);padding:9px 13px;border-radius:9px;font-size:10px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.16)}.primary:hover{transform:translateY(-1px)}.primary svg{width:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat,.card{border:1px solid var(--border);background:rgba(255,255,255,.022);border-radius:13px;box-shadow:0 10px 30px rgba(0,0,0,.045)}.light .card,.light .stat{background:rgba(255,255,255,.36);box-shadow:0 8px 24px rgba(30,32,34,.045)}.stat{padding:15px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;left:-50px;bottom:-55px;background:rgba(255,255,255,.025)}.stat-top{display:flex;justify-content:space-between;align-items:center}.stat-label{font-size:9px;color:var(--muted)}.stat-icon{width:29px;height:29px;border-radius:8px;background:rgba(255,255,255,.055);color:var(--primary-strong);display:grid;place-items:center}.stat-icon svg{width:14px}.stat-num{font-size:24px;font-weight:800;margin-top:11px;letter-spacing:-1px}.stat-foot{font-size:8px;color:var(--muted);margin-top:5px}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:12px;margin-top:12px}.card{overflow:hidden}.card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.012)}.card-title{font-size:11px;font-weight:700}.card-sub{font-size:8px;color:var(--muted);margin-top:3px}.link-btn{border:0;background:transparent;color:var(--primary-strong);font-size:8px}.chart-box{padding:16px}.chart{height:190px;position:relative}.chart svg{width:100%;height:100%}.chart-labels{display:grid;font-size:8px;color:var(--muted);text-align:center;margin-top:4px;gap:4px}.empty{height:190px;display:grid;place-items:center;color:var(--muted);font-size:10px}.activity{padding:5px 16px 12px}.act{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.055)}.act:last-child{border-bottom:0}.act-avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:9px;background:rgba(255,255,255,.055);color:var(--primary-strong)}.act-main{flex:1}.act-name{font-size:9px;font-weight:600}.act-text{font-size:8px;color:var(--muted);margin-top:2px}.act-time{font-size:7px;color:#666;white-space:nowrap}.table-card{margin-top:12px}.table-tools{width:100%;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap;padding:12px 16px}.search,.filter,.field input,.field select,.field textarea{appearance:none;-webkit-appearance:none;width:100%;min-height:38px;background:rgba(255,255,255,.045)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:11px;box-shadow:none}.light .search,.light .filter,.light .field input,.light .field select,.light .field textarea{background:rgba(255,255,255,.58)!important}.search{flex:1 1 280px;width:auto;max-width:none;padding:8px 10px;font-size:9px;outline:0}.search::placeholder,.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.9}.search:focus,.filter:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:rgba(176,166,154,.5)!important;box-shadow:0 0 0 3px var(--focus)!important}.filter{flex:0 0 150px;width:150px;padding-inline:34px 12px;font-size:9px;cursor:pointer}.table-wrap{width:100%;overflow-x:auto;overflow-y:hidden}table{width:100%;min-width:720px;border-collapse:collapse}th{font-size:8px;color:#777d83;font-weight:500;text-align:right;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}td{font-size:9px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.055);white-space:nowrap}tbody tr:hover{background:rgba(255,255,255,.028)}.student{display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#2a2d30,#1d2022);font-size:9px;font-weight:700}.light .avatar{background:linear-gradient(135deg,#d3d0ca,#bbb7b0);color:#34312d}.small{font-size:8px;color:var(--muted)}.progress{height:5px;width:90px;background:#292d30;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#766d64,#aaa095);border-radius:inherit}.status{display:inline-flex;padding:4px 7px;border-radius:6px;font-size:8px}.status.active{background:rgba(127,164,141,.12);color:#9ab5a4}.status.warning{background:rgba(180,161,111,.12);color:#c0af82}.status.inactive{background:rgba(185,135,135,.12);color:#c59898}.row-actions{display:flex;gap:4px}.row-btn{width:27px;height:27px;border:0;background:transparent;color:var(--muted);border-radius:7px;display:grid;place-items:center}.row-btn:hover{background:rgba(255,255,255,.055);color:var(--text)}.modal-back{position:fixed;inset:0;background:rgba(8,9,10,.62);display:none;place-items:center;z-index:100}.modal-back.show{display:grid}.modal,.drawer{background:rgba(23,25,28,.96);border:1px solid var(--border);border-radius:15px}.light .modal,.light .drawer{background:rgba(242,241,238,.97)}.modal{width:min(560px,calc(100% - 30px));padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{width:30px;height:30px;border:0;background:transparent;color:var(--muted);border-radius:7px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:8px;color:var(--muted)}.field input,.field select,.field textarea{padding:9px 10px;font-size:9px}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-start;gap:7px;margin-top:15px}.secondary{border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--text);padding:9px 13px;border-radius:9px;font-size:9px}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(440px,100%);z-index:110;border-radius:0;border-top:0;border-bottom:0;border-left:1px solid var(--border);padding:18px;transform:translateX(100%);transition:.25s;box-shadow:-24px 0 70px rgba(0,0,0,.22)}.drawer.show{transform:translateX(0)}.detail,.note{background:rgba(255,255,255,.028);border-radius:10px;padding:12px;margin-top:10px}.light .detail,.light .note{background:rgba(0,0,0,.025)}.mobile-menu{display:none}
@media(max-width:1000px){:root{--sidebar:220px}.main{padding-inline:22px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:760px){.table-tools{align-items:stretch}.table-tools .search,.table-tools .filter{flex:1 1 100%;width:100%;max-width:none}.form-grid{grid-template-columns:1fr}}
@media(max-width:640px){:root{--sidebar:0px}.sidebar{transform:translateX(100%);width:250px;transition:.25s}.sidebar.sa-open{transform:translateX(0)}.main{width:100%;margin-right:0;padding-inline:14px}.mobile-menu{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:var(--surface2);color:var(--text);font-size:20px}.topbar{gap:8px}.page-head{align-items:flex-start;gap:12px;flex-direction:column}.stats{grid-template-columns:1fr}.title{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-icon"><i data-lucide="graduation-cap"></i></div><div><div class="brand-name">Shima Academy</div><div class="brand-sub">پنل مدیریت مشاوره</div></div></div>
  <div class="workspace"><div class="ws-left"><div class="ws-avatar">SA</div><div><div class="ws-name">آکادمی شیما شادمان</div><div class="ws-sub" id="storageLabel">SQLite</div></div></div><button class="icon-btn" onclick="chooseFolder()"><i data-lucide="folder-cog"></i></button></div>
  <div class="nav-title">Workspace</div><nav class="nav">
    <button class="nav-btn active" data-page="dashboard" onclick="go('dashboard')"><i data-lucide="layout-dashboard"></i>داشبورد</button>
    <button class="nav-btn" data-page="students" onclick="go('students')"><i data-lucide="users"></i>دانش‌آموزان <span class="nav-count" id="studentCount">0</span></button>
    <button class="nav-btn" data-page="plans" onclick="go('plans')"><i data-lucide="calendar-days"></i>برنامه‌ها</button>
    <button class="nav-btn" data-page="exams" onclick="go('exams')"><i data-lucide="chart-no-axes-combined"></i>آزمون‌ها</button>
    <button class="nav-btn" data-page="notes" onclick="go('notes')"><i data-lucide="notebook-pen"></i>یادداشت‌ها</button>
  </nav>
  <div class="nav-title">System</div><nav class="nav"><button class="nav-btn" data-page="settings" onclick="go('settings')"><i data-lucide="settings-2"></i>تنظیمات</button></nav>
  <div class="sidebar-bottom"><div class="user"><div class="user-avatar">ش</div><div><div class="user-name">مشاور</div><div class="user-sub">Shima Academy</div></div></div></div>
</aside>
<main class="main">
<header class="topbar"><button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('sa-open')">☰</button><div class="crumb" id="crumb">داشبورد</div><div class="top-actions"><button class="icon-btn" onclick="toggleTheme()" title="تغییر تم"><i data-lucide="sun-moon"></i></button></div></header>
<div class="content" id="content"></div>
</main></div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="drawer" id="drawer"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let db=null, SQL=null, currentPage='dashboard', storageInfo=null;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function init(){
  if(window.electronAPI){storageInfo=await window.electronAPI.getStorageInfo(); if(storageInfo?.folder) $('#storageLabel').textContent=storageInfo.folder.split(/[\\/]/).pop()||'SQLite';}
  SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/'+f});
  let data=window.electronAPI?await window.electronAPI.loadDatabase():null;
  if(data) db=new SQL.Database(Uint8Array.from(atob(data),c=>c.charCodeAt(0))); else db=new SQL.Database();
  createTables(); render(); lucide.createIcons();
}
function createTables(){
 db.run(`CREATE TABLE IF NOT EXISTS students(id INTEGER PRIMARY KEY,first_name TEXT,last_name TEXT,phone TEXT,grade TEXT,field TEXT,advisor TEXT,status TEXT,score REAL,progress INTEGER,created_at TEXT);
 CREATE TABLE IF NOT EXISTS plans(id INTEGER PRIMARY KEY,student_id INTEGER,date TEXT,subject TEXT,title TEXT,duration INTEGER,status TEXT);
 CREATE TABLE IF NOT EXISTS exams(id INTEGER PRIMARY KEY,student_id INTEGER,title TEXT,date TEXT,score REAL);
 CREATE TABLE IF NOT EXISTS notes(id INTEGER PRIMARY KEY,student_id INTEGER,text TEXT,date TEXT);`); persist();
}
function persist(){if(!db)return; if(window.electronAPI){const bytes=db.export(); let bin=''; for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000)); window.electronAPI.saveDatabase(btoa(bin));}}
function q(sql,params=[]){const st=db.prepare(sql);st.bind(params);const rows=[];while(st.step())rows.push(st.getAsObject());st.free();return rows}
function one(sql,p=[]){return q(sql,p)[0]||null} function nextId(t){return (one('SELECT COALESCE(MAX(id),0)+1 n FROM '+t)||{n:1}).n}
function go(page){currentPage=page;$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();}
function render(){if(!db)return;$('#crumb').textContent={dashboard:'داشبورد',students:'دانش‌آموزان',plans:'برنامه‌ها',exams:'آزمون‌ها',notes:'یادداشت‌ها',settings:'تنظیمات'}[currentPage];({dashboard:dashboard,students:studentsPage,plans:plansPage,exams:examsPage,notes:notesPage,settings:settingsPage}[currentPage])();lucide.createIcons();}
function head(k,d,btn){return `<div class="page-head"><div><div class="eyebrow">SHIMA ACADEMY</div><h1 class="title">${k}</h1><div class="desc">${d}</div></div>${btn||''}</div>`}
function dashboard(){const students=one('SELECT COUNT(*) n FROM students').n||0, plans=one("SELECT COUNT(*) n FROM plans WHERE status!='done'").n||0, exams=one('SELECT COUNT(*) n FROM exams').n||0, avg=one('SELECT ROUND(AVG(score),0) n FROM exams').n;
 let chart=q(`SELECT title, date, ROUND(AVG(score),0) score FROM exams GROUP BY title,date ORDER BY date DESC LIMIT 7`).reverse();
 let chartHtml=chart.length?`<div class="chart"><svg viewBox="0 0 700 190" preserveAspectRatio="none"><line x1="0" y1="165" x2="700" y2="165" stroke="rgba(255,255,255,.08)"/><line x1="0" y1="90" x2="700" y2="90" stroke="rgba(255,255,255,.06)"/><polyline fill="none" stroke="#aaa095" stroke-width="3" points="${chart.map((x,i)=>`${i*(700/Math.max(1,chart.length-1))},${165-((Number(x.score)-Math.min(...chart.map(c=>Number(c.score))))/Math.max(1,Math.max(...chart.map(c=>Number(c.score)))-Math.min(...chart.map(c=>Number(c.score))))*130}`).join(' ')}"/></svg></div><div class="chart-labels" style="grid-template-columns:repeat(${chart.length},1fr)">${chart.map(x=>`<span>${esc(x.date||x.title||'—')}</span>`).join('')}</div>`:`<div class="empty">هنوز داده‌ای برای نمایش وجود ندارد</div>`;
 $('#studentCount').textContent=students;$('#content').innerHTML=head('داشبورد','نمای کلی وضعیت آکادمی')+`<div class="stats"><div class="stat"><div class="stat-top"><span class="stat-label">دانش‌آموزان</span><span class="stat-icon"><i data-lucide="users"></i></span></div><div class="stat-num">${students}</div><div class="stat-foot">ثبت‌شده در دیتابیس</div></div><div class="stat"><div class="stat-top"><span class="stat-label">برنامه‌های فعال</span><span class="stat-icon"><i data-lucide="calendar-check"></i></span></div><div class="stat-num">${plans}</div><div class="stat-foot">برنامه‌های در حال اجرا</div></div><div class="stat"><div class="stat-top"><span class="stat-label">آزمون‌ها</span><span class="stat-icon"><i data-lucide="file-chart-column"></i></span></div><div class="stat-num">${exams}</div><div class="stat-foot">رکورد واقعی آزمون</div></div><div class="stat"><div class="stat-top"><span class="stat-label">میانگین تراز</span><span class="stat-icon"><i data-lucide="gauge"></i></span></div><div class="stat-num">${avg??'—'}</div><div class="stat-foot">محاسبه‌شده از آزمون‌ها</div></div></div><div class="grid"><div class="card"><div class="card-head"><div><div class="card-title">روند میانگین تراز</div><div class="card-sub">داده از SQLite</div></div></div><div class="chart-box">${chartHtml}</div></div><div class="card"><div class="card-head"><div><div class="card-title">آخرین فعالیت‌ها</div><div class="card-sub">بر اساس رکوردهای دیتابیس</div></div></div><div class="activity">${recentActivity()}</div></div></div>`;}
function recentActivity(){const rows=q(`SELECT 'exam' type,title,date FROM exams ORDER BY date DESC LIMIT 4`);if(!rows.length)return '<div class="empty" style="height:130px">هنوز فعالیتی ثبت نشده است</div>';return rows.map(r=>`<div class="act"><div class="act-avatar"><i data-lucide="file-check-2"></i></div><div class="act-main"><div class="act-name">${esc(r.title||'آزمون')}</div><div class="act-text">آزمون ثبت شد</div></div><div class="act-time">${esc(r.date||'')}</div></div>`).join('')}
function studentsPage(){const rows=q('SELECT * FROM students ORDER BY id DESC');$('#studentCount').textContent=rows.length;$('#content').innerHTML=head('دانش‌آموزان','مدیریت اطلاعات دانش‌آموزان',`<button class="primary" onclick="openStudentModal()"><i data-lucide="plus"></i>دانش‌آموز جدید</button>`)+`<div class="card table-card"><div class="table-tools"><input class="search" id="studentSearch" placeholder="جستجو در نام، تلفن یا رشته..." oninput="filterStudents()"><select class="filter" id="studentFilter" onchange="filterStudents()"><option value="">همه وضعیت‌ها</option><option>active</option><option>warning</option><option>inactive</option></select></div><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>پایه</th><th>رشته</th><th>تراز</th><th>پیشرفت</th><th>وضعیت</th><th></th></tr></thead><tbody id="studentRows">${studentRows(rows)}</tbody></table></div></div>`}
function studentRows(rows){return rows.map(s=>`<tr><td><div class="student"><div class="avatar">${esc((s.first_name||'?')[0]+(s.last_name||'')[0])}</div><div><b>${esc((s.first_name||'')+' '+(s.last_name||''))}</b><div class="small">${esc(s.phone||'—')}</div></div></div></td><td>${esc(s.grade||'—')}</td><td>${esc(s.field||'—')}</td><td>${s.score??'—'}</td><td><div class="progress"><i style="width:${Math.min(100,Math.max(0,Number(s.progress)||0))}%"></i></div></td><td><span class="status ${esc(s.status||'active')}">${esc(s.status||'active')}</span></td><td><div class="row-actions"><button class="row-btn" onclick="openStudentModal(${s.id})"><i data-lucide="pencil"></i></button><button class="row-btn" onclick="deleteStudent(${s.id})"><i data-lucide="trash-2"></i></button></div></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">هنوز دانش‌آموزی ثبت نشده است</div></td></tr>`}
function filterStudents(){const text=($('#studentSearch')?.value||'').toLowerCase(),status=$('#studentFilter')?.value||'';const rows=q('SELECT * FROM students ORDER BY id DESC').filter(s=>(`${s.first_name||''} ${s.last_name||''} ${s.phone||''} ${s.field||''}`).toLowerCase().includes(text)&&(!status||s.status===status));$('#studentRows').innerHTML=studentRows(rows);lucide.createIcons()}
function plansPage(){const rows=q('SELECT p.*,s.first_name,s.last_name FROM plans p LEFT JOIN students s ON s.id=p.student_id ORDER BY p.date DESC');$('#content').innerHTML=head('برنامه‌ها','برنامه‌ریزی مطالعه و پیگیری اجرا',`<button class="primary" onclick="openPlanModal()"><i data-lucide="plus"></i>برنامه جدید</button>`)+`<div class="card table-card"><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>تاریخ</th><th>درس</th><th>عنوان</th><th>مدت</th><th>وضعیت</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc((p.first_name||'')+' '+(p.last_name||''))}</td><td>${esc(p.date||'—')}</td><td>${esc(p.subject||'—')}</td><td>${esc(p.title||'—')}</td><td>${p.duration??'—'} دقیقه</td><td><span class="status ${p.status==='done'?'active':'warning'}">${esc(p.status||'pending')}</span></td><td><div class="row-actions"><button class="row-btn" onclick="togglePlan(${p.id})"><i data-lucide="check"></i></button><button class="row-btn" onclick="deletePlan(${p.id})"><i data-lucide="trash-2"></i></button></div></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">هنوز برنامه‌ای ثبت نشده است</div></td></tr>`}</tbody></table></div></div>`}
function examsPage(){const rows=q('SELECT e.*,s.first_name,s.last_name FROM exams e LEFT JOIN students s ON s.id=e.student_id ORDER BY e.date DESC');$('#content').innerHTML=head('آزمون‌ها','ثبت نتایج واقعی آزمون‌ها',`<button class="primary" onclick="openExamModal()"><i data-lucide="plus"></i>ثبت آزمون</button>`)+`<div class="card table-card"><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>آزمون</th><th>تاریخ</th><th>تراز</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc((e.first_name||'')+' '+(e.last_name||''))}</td><td>${esc(e.title||'—')}</td><td>${esc(e.date||'—')}</td><td>${e.score??'—'}</td><td><button class="row-btn" onclick="deleteExam(${e.id})"><i data-lucide="trash-2"></i></button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">هنوز آزمونی ثبت نشده است</div></td></tr>`}</tbody></table></div></div>`}
function notesPage(){const rows=q('SELECT n.*,s.first_name,s.last_name FROM notes n LEFT JOIN students s ON s.id=n.student_id ORDER BY n.date DESC');$('#content').innerHTML=head('یادداشت‌ها','یادداشت‌های مشاوره‌ای',`<button class="primary" onclick="openNoteModal()"><i data-lucide="plus"></i>یادداشت جدید</button>`)+`<div class="card table-card"><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>تاریخ</th><th>یادداشت</th><th></th></tr></thead><tbody>${rows.map(n=>`<tr><td>${esc((n.first_name||'')+' '+(n.last_name||''))}</td><td>${esc(n.date||'—')}</td><td>${esc(n.text||'')}</td><td><button class="row-btn" onclick="deleteNote(${n.id})"><i data-lucide="trash-2"></i></button></td></tr>`).join('')||`<tr><td colspan="4"><div class="empty">هنوز یادداشتی ثبت نشده است</div></td></tr>`}</tbody></table></div></div>`}
function settingsPage(){const info=storageInfo;$('#content').innerHTML=head('تنظیمات','ذخیره‌سازی و کنترل داده‌ها')+`<div class="card" style="padding:18px"><div class="card-title">ذخیره‌سازی SQLite</div><div class="detail">پوشه: ${esc(info?.folder||'هنوز انتخاب نشده')}</div><div class="detail">فایل: ${esc(info?.file||'shima-academy.sqlite')}</div><div class="modal-actions"><button class="primary" onclick="chooseFolder()"><i data-lucide="folder-open"></i>انتخاب پوشه</button><button class="secondary" onclick="exportDB()">خروجی دیتابیس</button><button class="secondary" onclick="resetDB()">پاک‌سازی دیتابیس</button></div></div>`}
function studentsOptions(){return q('SELECT id,first_name,last_name FROM students ORDER BY first_name,last_name').map(s=>`<option value="${s.id}">${esc((s.first_name||'')+' '+(s.last_name||''))}</option>`).join('')}
function openModal(html){$('#modal').innerHTML=html;$('#modalBack').classList.add('show');lucide.createIcons()}function closeModal(){$('#modalBack').classList.remove('show')}
function openStudentModal(id){const s=id?one('SELECT * FROM students WHERE id=?',[id]):{};openModal(`<div class="modal-head"><div class="card-title">${id?'ویرایش دانش‌آموز':'دانش‌آموز جدید'}</div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>نام</label><input id="f1" value="${esc(s.first_name||'')}"></div><div class="field"><label>نام خانوادگی</label><input id="f2" value="${esc(s.last_name||'')}"></div><div class="field"><label>تلفن</label><input id="f3" value="${esc(s.phone||'')}"></div><div class="field"><label>پایه</label><input id="f4" value="${esc(s.grade||'')}"></div><div class="field"><label>رشته</label><input id="f5" value="${esc(s.field||'')}"></div><div class="field"><label>مشاور</label><input id="f6" value="${esc(s.advisor||'')}"></div><div class="field"><label>وضعیت</label><select id="f7"><option ${s.status==='active'?'selected':''}>active</option><option ${s.status==='warning'?'selected':''}>warning</option><option ${s.status==='inactive'?'selected':''}>inactive</option></select></div><div class="field"><label>تراز</label><input id="f8" type="number" value="${s.score??''}"></div><div class="field"><label>پیشرفت (%)</label><input id="f9" type="number" min="0" max="100" value="${s.progress??''}"></div></div><div class="modal-actions"><button class="primary" onclick="saveStudent(${id||0})">ذخیره</button><button class="secondary" onclick="closeModal()">انصراف</button></div>`)}
function saveStudent(id){const v=[$('#f1').value,$('#f2').value,$('#f3').value,$('#f4').value,$('#f5').value,$('#f6').value,$('#f7').value,Number($('#f8').value)||null,Number($('#f9').value)||0];if(!v[0]&&!v[1])return alert('نام دانش‌آموز را وارد کنید');if(id)db.run('UPDATE students SET first_name=?,last_name=?,phone=?,grade=?,field=?,advisor=?,status=?,score=?,progress=? WHERE id=?',[...v,id]);else db.run('INSERT INTO students VALUES(?,?,?,?,?,?,?,?,?,?,?)',[nextId('students'),...v,new Date().toISOString().slice(0,10)]);persist();closeModal();render()}
function deleteStudent(id){if(confirm('این دانش‌آموز حذف شود؟')){db.run('DELETE FROM students WHERE id=?',[id]);persist();render()}}
function openPlanModal(){openModal(`<div class="modal-head"><div class="card-title">برنامه جدید</div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>دانش‌آموز</label><select id="p1">${studentsOptions()}</select></div><div class="field"><label>تاریخ</label><input id="p2" type="date"></div><div class="field"><label>درس</label><input id="p3"></div><div class="field full"><label>عنوان</label><input id="p4"></div><div class="field"><label>مدت (دقیقه)</label><input id="p5" type="number"></div></div><div class="modal-actions"><button class="primary" onclick="savePlan()">ذخیره</button><button class="secondary" onclick="closeModal()">انصراف</button></div>`)}
function savePlan(){db.run('INSERT INTO plans VALUES(?,?,?,?,?,?,?)',[nextId('plans'),Number($('#p1').value),$('#p2').value,$('#p3').value,$('#p4').value,Number($('#p5').value)||0,'pending']);persist();closeModal();render()}
function togglePlan(id){db.run("UPDATE plans SET status=CASE WHEN status='done' THEN 'pending' ELSE 'done' END WHERE id=?",[id]);persist();render()}function deletePlan(id){if(confirm('حذف شود؟')){db.run('DELETE FROM plans WHERE id=?',[id]);persist();render()}}
function openExamModal(){openModal(`<div class="modal-head"><div class="card-title">ثبت آزمون</div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>دانش‌آموز</label><select id="e1">${studentsOptions()}</select></div><div class="field"><label>عنوان آزمون</label><input id="e2"></div><div class="field"><label>تاریخ</label><input id="e3" type="date"></div><div class="field"><label>تراز</label><input id="e4" type="number"></div></div><div class="modal-actions"><button class="primary" onclick="saveExam()">ذخیره</button><button class="secondary" onclick="closeModal()">انصراف</button></div>`)}
function saveExam(){db.run('INSERT INTO exams VALUES(?,?,?,?,?)',[nextId('exams'),Number($('#e1').value),$('#e2').value,$('#e3').value,Number($('#e4').value)||0]);persist();closeModal();render()}function deleteExam(id){if(confirm('حذف شود؟')){db.run('DELETE FROM exams WHERE id=?',[id]);persist();render()}}
function openNoteModal(){openModal(`<div class="modal-head"><div class="card-title">یادداشت جدید</div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>دانش‌آموز</label><select id="n1">${studentsOptions()}</select></div><div class="field"><label>تاریخ</label><input id="n2" type="date"></div><div class="field full"><label>متن یادداشت</label><textarea id="n3"></textarea></div></div><div class="modal-actions"><button class="primary" onclick="saveNote()">ذخیره</button><button class="secondary" onclick="closeModal()">انصراف</button></div>`)}
function saveNote(){db.run('INSERT INTO notes VALUES(?,?,?,?)',[nextId('notes'),Number($('#n1').value),$('#n3').value,$('#n2').value]);persist();closeModal();render()}function deleteNote(id){if(confirm('حذف شود؟')){db.run('DELETE FROM notes WHERE id=?',[id]);persist();render()}}
async function chooseFolder(){if(!window.electronAPI)return alert('این قابلیت فقط در نسخه دسکتاپ Electron فعال است.');const r=await window.electronAPI.chooseFolder();if(!r.cancelled){storageInfo={folder:r.folder,file:r.folder+'/shima-academy.sqlite'};$('#storageLabel').textContent=r.folder.split(/[\\/]/).pop()||'SQLite';if(r.data){db=new SQL.Database(Uint8Array.from(atob(r.data),c=>c.charCodeAt(0)));createTables()}persist();render()}}
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('shima-theme',document.body.classList.contains('light')?'light':'dark')}function exportDB(){const bytes=db.export();let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const a=document.createElement('a');a.href='data:application/octet-stream;base64,'+btoa(bin);a.download='shima-academy.sqlite';a.click()}function resetDB(){if(!confirm('تمام داده‌های دیتابیس پاک شوند؟'))return;db=new SQL.Database();createTables();persist();render()}
if(localStorage.getItem('shima-theme')==='light')document.body.classList.add('light');
init();
</script>
</body></html>
