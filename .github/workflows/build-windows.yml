name: Build Windows Installer

on:
  push:
    branches: [v2-stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify Electron
        run: npx electron --version

      - name: Build Windows installer
        run: npm run dist

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'Shadman-Academy-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'Shadman Academy installer was not created.'
          }
          Write-Host "Installer created: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Shadman-Academy-Windows-Installer-v2.0.2
          path: dist/Shadman-Academy-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
