name: Build Windows Installer

on:
  push:
    branches: [v2-stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron
        run: npx electron --version

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Shima-Academy-Windows-Installer-v2
          path: dist/Shima-Academy-Setup-2.0.0.exe
          if-no-files-found: error
          retention-days: 14
