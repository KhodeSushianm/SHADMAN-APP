<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadman Academy — ورود</title>
<style>
:root{--bg:#101214;--panel:#171a1d;--text:#f2f0ec;--muted:#92979c;--line:rgba(255,255,255,.09);--accent:#b7a9ff;--accent2:#8066e8;--red:#d18b8b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(128,102,232,.18),transparent 36%),linear-gradient(180deg,#121416,#0e1012);color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(430px,100%)}
.card{border:1px solid var(--line);background:rgba(23,26,29,.94);border-radius:22px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
.brand{text-align:center}.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;overflow:hidden;box-shadow:0 12px 35px rgba(114,82,232,.2)}.logo img{width:100%;height:100%;display:block;object-fit:cover}.brand h1{font-size:21px;margin:0;font-weight:900}.brand p{font-size:10px;color:var(--muted);margin:7px 0 28px}
.form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:9px;color:var(--muted)}.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.045);color:var(--text);outline:none;padding:0 13px;font:inherit;font-size:11px;direction:ltr;text-align:left}.field input:focus{border-color:rgba(183,169,255,.55);box-shadow:0 0 0 3px rgba(128,102,232,.11)}
.submit{height:46px;border:0;border-radius:11px;background:linear-gradient(135deg,#8b73ef,#6650c9);color:#fff;font:inherit;font-size:11px;font-weight:800;cursor:pointer;margin-top:4px;box-shadow:0 12px 28px rgba(102,80,201,.22)}.submit:hover{filter:brightness(1.06);transform:translateY(-1px)}.submit:disabled{opacity:.65;cursor:wait;transform:none}
.error{min-height:18px;color:var(--red);font-size:9px;text-align:center;margin-top:12px}.hint{text-align:center;color:#666b70;font-size:8px;margin-top:22px}
@media(max-width:480px){.card{padding:24px}.logo{width:64px;height:64px}}
</style>
</head>
<body>
<main class="shell"><section class="card">
  <div class="brand">
    <div class="logo"><img src="assets/shadman-academy-logo.svg" alt="Shadman Academy"></div>
    <h1>Shadman Academy</h1>
    <p>ورود به پنل مدیریت مشاوره</p>
  </div>
  <form class="form" id="loginForm" autocomplete="off">
    <div class="field"><label for="username">نام کاربری</label><input id="username" name="username" type="text" autocomplete="username" spellcheck="false" required autofocus></div>
    <div class="field"><label for="password">رمز عبور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="submit" id="submit" type="submit">ورود به برنامه</button>
  </form>
  <div class="error" id="error" aria-live="polite"></div>
  <div class="hint">دسترسی فقط برای مشاور مجاز است</div>
</section></main>
<script>
const form=document.getElementById('loginForm'), username=document.getElementById('username'), password=document.getElementById('password'), submit=document.getElementById('submit'), error=document.getElementById('error');
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='در حال بررسی...';try{const r=await window.shadmanAuth.login(username.value.trim(),password.value);if(r&&r.ok)return;error.textContent='نام کاربری یا رمز عبور اشتباه است.';password.select()}catch(_){error.textContent='خطا در ورود. دوباره تلاش کنید.'}finally{submit.disabled=false;submit.textContent='ورود به برنامه'}});
</script>
</body>
</html>
